name: Python CI

on:
  push:
    branches:
      - python-port
  pull_request:
    branches:
      - python-port

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall iograph

      - name: Import smoke check
        run: python -c "import iograph.main, iograph.tracker; print('import-ok')"
