name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      IOGRAPH_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS icon (.icns)
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16 iograph/resources/icon512.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 iograph/resources/icon512.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 iograph/resources/icon512.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 iograph/resources/icon512.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 iograph/resources/icon512.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 iograph/resources/icon512.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 iograph/resources/icon512.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 iograph/resources/icon512.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 iograph/resources/icon512.png --out build/icon.iconset/icon_512x512.png
          cp iograph/resources/icon512.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/IOGraph.icns

      - name: Build app bundle
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name IOGraph \
            --icon build/IOGraph.icns \
            --add-data "iograph/resources:iograph/resources" \
            --collect-all PyQt6 \
            run_iograph.py

      - name: Set app bundle version metadata
        run: |
          APP_PLIST="dist/IOGraph.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${IOGRAPH_VERSION}" "$APP_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${IOGRAPH_VERSION}" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSUIElement true" "$APP_PLIST" || /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$APP_PLIST"

      - name: Re-sign app bundle (ad-hoc for beta)
        run: |
          codesign --force --deep --sign - dist/IOGraph.app
          codesign --verify --deep --strict --verbose=2 dist/IOGraph.app

      - name: Prepare artifact
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/IOGraph.app release/IOGraph-macos.zip
          hdiutil create \
            -volname "IOGraph" \
            -srcfolder "dist/IOGraph.app" \
            -ov \
            -format UDZO \
            "release/IOGraph-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOGraph-macos
          path: |
            release/IOGraph-macos.zip
            release/IOGraph-macos.dmg

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IOGraph-macos.zip
            release/IOGraph-macos.dmg
          prerelease: ${{ contains(github.ref_name, '-') }}
